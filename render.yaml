services:
  - type: web
    name: mechabot
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromService:
          name: mechabot-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        fromService:
          name: mechabot-mysql
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          name: mechabot-mysql
          type: pserv
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          name: mechabot-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: UPLOAD_DIR
        value: uploads
      - key: VERIFY_EMAIL_ENABLED
        value: "false"
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_SUPABASE_URL
        value: https://gxdczdarmymiombtxkit.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4ZGN6ZGFybXltaW9tYnR4a2l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1Mzc2MTMsImV4cCI6MjA4NzExMzYxM30.VWnA8fdQ07FgRIorxhb6MelNVwOhcCQWoyuNPEZTgZU
      - key: VITE_SUPABASE_PROJECT_ID
        value: gxdczdarmymiombtxkit
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: ""
      - key: MAIL_PASSWORD
        value: ""
      - key: MAIL_FROM_ADDRESS
        value: ""
      - key: MAIL_FROM_NAME
        value: MechaBot Platform

  - type: pserv
    name: mechabot-mysql
    runtime: docker
    plan: starter
    repo: https://github.com/render-examples/mysql
    disk:
      name: mechabot-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: mechabot
      - key: MYSQL_USER
        value: mechabot
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
