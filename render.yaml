services:
  - type: web
    name: mechabot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_DRIVER
        value: sqlite
      - key: UPLOAD_DIR
        value: uploads
      - key: VERIFY_EMAIL_ENABLED
        value: "false"
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_SUPABASE_URL
        value: https://gxdczdarmymiombtxkit.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4ZGN6ZGFybXltaW9tYnR4a2l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1Mzc2MTMsImV4cCI6MjA4NzExMzYxM30.VWnA8fdQ07FgRIorxhb6MelNVwOhcCQWoyuNPEZTgZU
      - key: VITE_SUPABASE_PROJECT_ID
        value: gxdczdarmymiombtxkit
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: MechaBot Platform
      - key: ADMIN_EMAIL
        sync: false

  # Optional: keep using MySQL instead of the built-in SQLite database.
